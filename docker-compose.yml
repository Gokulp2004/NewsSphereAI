version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/newssphere
      NEWSAPI_KEY: ${NEWSAPI_KEY}
      GNEWS_API_KEY: ${GNEWS_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      API_KEY: ${API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-*/30 * * * *}
      NEWS_TOPICS: ${NEWS_TOPICS:-ai,technology,business,science,health,world,sports}
      CLUSTER_THRESHOLD: ${CLUSTER_THRESHOLD:-0.35}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      PAGE_LIMIT_DEFAULT: ${PAGE_LIMIT_DEFAULT:-12}
      PAGE_LIMIT_MAX: ${PAGE_LIMIT_MAX:-50}
      NEWS_PAGE_SIZE: ${NEWS_PAGE_SIZE:-20}
      RUN_INGEST_ON_START: ${RUN_INGEST_ON_START:-true}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_API_KEY: ${API_KEY}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
